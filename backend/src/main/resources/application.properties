# Application
spring.application.name=myboss-backend

# Render provides PORT at runtime; keep 8080 for local development.
server.port=${PORT:8080}

# PostgreSQL connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# Clerk JWT Verification
clerk.issuer=${CLERK_ISSUER}
clerk.jwks-uri=${CLERK_JWKS_URI}

# Frontend origins, separated by commas when more than one is needed.
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Frontend URL used when generating staff invitation links
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Render health check endpoint.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true